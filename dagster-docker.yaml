storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname:
        env: DAGSTER_POSTGRES_HOST
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    image:
      env: DAGSTER_CURRENT_IMAGE
    env_vars:
      - DAGSTER_POSTGRES_USER
      - DAGSTER_POSTGRES_PASSWORD
      - DAGSTER_POSTGRES_DB
      - DAGSTER_POSTGRES_HOST
      - DAGSTER_HOME
      - GRAPHDB_BASE_URL
      - GRAPHDB_REPOSITORY_ID
      - GRAPHDB_REPOSITORY_TITLE
      - GRAPHDB_CLEAR_BEFORE_UPLOAD
      - GRAPHDB_TIMEOUT_SECONDS
      - GRAPHDB_MAX_READINESS_CHECKS
      - GRAPHDB_READINESS_CHECK_INTERVAL_SECONDS
      - GRAPHDB_USERNAME
      - GRAPHDB_PASSWORD
      - KEYCLOAK_SERVER_URL
      - KEYCLOAK_REALM
      - KEYCLOAK_CLIENT_ID
      - KEYCLOAK_CLIENT_SECRET
    network: twinship-data-pipeline_twinship_network
    container_kwargs:
      volumes:
        - twinship-data-pipeline_dagster_storage:/app/storage
        - twinship-data-pipeline_pipeline_output:/app/output

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 2
