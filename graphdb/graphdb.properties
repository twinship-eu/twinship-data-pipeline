# Authentication: OpenID Connect via Keycloak
graphdb.auth.methods=openid

# OpenID Connect provider settings
# graphdb.auth.openid.issuer is deployment-specific (and must match the "iss"
# claim in JWTs), so it is not set here. It is instead injected at container
# startup as a JVM system property via GDB_JAVA_OPTS, sourced from the
# GRAPHDB_OIDC_ISSUER value in .env (see docker-compose.yml).
graphdb.auth.openid.client_id=graphdb
graphdb.auth.openid.username_claim=preferred_username
graphdb.auth.openid.auth_flow=code
graphdb.auth.openid.token_type=access

# Authorization: read roles from JWT (not local DB)
graphdb.auth.database=oauth
graphdb.auth.oauth.roles_claim=realm_access.roles
