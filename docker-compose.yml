x-graphdb-env: &graphdb-env
  GRAPHDB_BASE_URL: http://graphdb:7200
  GRAPHDB_REPOSITORY_ID: twinship
  GRAPHDB_REPOSITORY_TITLE: TwinShip Data Repository
  GRAPHDB_CLEAR_BEFORE_UPLOAD: "true"
  GRAPHDB_TIMEOUT_SECONDS: "30"
  GRAPHDB_MAX_READINESS_CHECKS: "20"
  GRAPHDB_READINESS_CHECK_INTERVAL_SECONDS: "3"
  GRAPHDB_USERNAME: ""
  GRAPHDB_PASSWORD: ""
  KEYCLOAK_SERVER_URL: http://keycloak:8080
  KEYCLOAK_REALM: twinship
  KEYCLOAK_CLIENT_ID: dagster-pipeline
  KEYCLOAK_CLIENT_SECRET: dagster-pipeline-secret

services:
  # PostgreSQL for Dagster storage
  postgresql:
    image: postgres:15
    container_name: twinship_postgresql
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - twinship_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak OIDC provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: twinship_keycloak
    command: start-dev --import-realm --health-enabled=true
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/twinship-realm.json:/opt/keycloak/data/import/twinship-realm.json:ro
    networks:
      - twinship_network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # GraphDB triplestore
  graphdb:
    image: ontotext/graphdb:10.8.12
    container_name: twinship_graphdb
    ports:
      - "7200:7200"
    volumes:
      - graphdb_home:/opt/graphdb/home
      - ./graphdb/graphdb.properties:/opt/graphdb/home/conf/graphdb.properties:ro
    networks:
      - twinship_network
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sfo /dev/null -w '%{http_code}' http://localhost:7200/rest/repositories | grep -qE '^(200|401|403)$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot init container: enables GraphDB security after first boot
  graphdb-init:
    image: curlimages/curl:latest
    container_name: twinship_graphdb_init
    entrypoint: ["sh", "-c", "echo 'Waiting for GraphDB...' && until curl -sf http://graphdb:7200/rest/repositories > /dev/null 2>&1; do sleep 2; done && echo 'Enabling security...' && curl -s -X POST -H 'Content-Type: application/json' -d 'true' http://graphdb:7200/rest/security && echo ' Done.'"]
    networks:
      - twinship_network
    depends_on:
      graphdb:
        condition: service_healthy
    restart: "no"

  # User code container (gRPC server)
  user_code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twinship_user_code
    image: twinship_user_code:latest
    restart: always
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
      DAGSTER_HOME: /app
      <<: *graphdb-env
    volumes:
      - ./data:/app/data
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      postgresql:
        condition: service_healthy
      graphdb:
        condition: service_healthy

  # Dagster webserver
  webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: twinship_webserver
    entrypoint:
      - uv
      - run
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      - postgresql
      - user_code

  # Dagster daemon (schedules, sensors, run queue)
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: twinship_daemon
    entrypoint:
      - uv
      - run
      - dagster-daemon
      - run
    restart: on-failure
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
      <<: *graphdb-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      - postgresql
      - user_code

volumes:
  postgresql_data:
  graphdb_home:
  dagster_storage:
  pipeline_output:

networks:
  twinship_network:
    driver: bridge
