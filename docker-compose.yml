x-graphdb-env: &graphdb-env
  GRAPHDB_BASE_URL: ${GRAPHDB_BASE_URL:-http://graphdb:7200}
  GRAPHDB_REPOSITORY_ID: twinship
  GRAPHDB_REPOSITORY_TITLE: TwinShip Data Repository
  GRAPHDB_CLEAR_BEFORE_UPLOAD: "true"
  GRAPHDB_TIMEOUT_SECONDS: "30"
  GRAPHDB_MAX_READINESS_CHECKS: "20"
  GRAPHDB_READINESS_CHECK_INTERVAL_SECONDS: "3"
  GRAPHDB_USERNAME: ""
  GRAPHDB_PASSWORD: ""
  KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
  KEYCLOAK_REALM: twinship
  KEYCLOAK_CLIENT_ID: dagster-pipeline
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-dev-dagster-client-secret}

services:
  # PostgreSQL for Dagster storage
  postgresql:
    image: postgres:15
    container_name: twinship_postgresql
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - twinship_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak OIDC provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: twinship_keycloak
    # The entrypoint renders twinship-realm.json from its template (substituting
    # the secrets below) before handing off to the command below. See
    # keycloak/render-realm.sh.
    entrypoint: ["bash", "/opt/keycloak/render/render-realm.sh"]
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-admin-password}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-dev-dagster-client-secret}
      KEYCLOAK_GRIMALDI_RORO_PASSWORD: ${KEYCLOAK_GRIMALDI_RORO_PASSWORD:-local-dev-grimaldi-roro-password}
      KEYCLOAK_STENA_ROPAX_PASSWORD: ${KEYCLOAK_STENA_ROPAX_PASSWORD:-local-dev-stena-ropax-password}
      KEYCLOAK_STENA_TANKER_PASSWORD: ${KEYCLOAK_STENA_TANKER_PASSWORD:-local-dev-stena-tanker-password}
      KEYCLOAK_FUTURISTIC_VESSEL_PASSWORD: ${KEYCLOAK_FUTURISTIC_VESSEL_PASSWORD:-local-dev-futuristic-vessel-password}
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/twinship-realm.json.template:/opt/keycloak/render/twinship-realm.json.template:ro
      - ./keycloak/render-realm.sh:/opt/keycloak/render/render-realm.sh:ro
    networks:
      - twinship_network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # GraphDB triplestore
  graphdb:
    image: ontotext/graphdb:10.8.12
    container_name: twinship_graphdb
    environment:
      # graphdb.auth.openid.issuer is deployment-specific and therefore not
      # set in graphdb/graphdb.properties; it's injected here as a JVM system
      # property instead (see GRAPHDB_OIDC_ISSUER in .env).
      GDB_JAVA_OPTS: "-Dgraphdb.auth.openid.issuer=${GRAPHDB_OIDC_ISSUER:-http://keycloak:8080/realms/twinship} -Xms1g -Xmx2g"
    ports:
      - "${GRAPHDB_PORT:-7200}:7200"
    volumes:
      - graphdb_home:/opt/graphdb/home
      - ./graphdb/graphdb.properties:/opt/graphdb/home/conf/graphdb.properties:ro
      - ./ontology:/root/graphdb-import/ontology:ro
    networks:
      - twinship_network
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sfo /dev/null -w '%{http_code}' http://localhost:7200/rest/repositories | grep -qE '^(200|401|403)$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot init container: creates ontology repo, imports files, enables security
  graphdb-init:
    image: curlimages/curl:latest
    container_name: twinship_graphdb_init
    entrypoint: ["sh", "/scripts/init.sh"]
    volumes:
      - ./graphdb/init.sh:/scripts/init.sh:ro
      - ./ontology/catalog-v001.xml:/scripts/catalog-v001.xml:ro
    networks:
      - twinship_network
    depends_on:
      graphdb:
        condition: service_healthy
    restart: "no"

  # User code container (gRPC server)
  user_code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twinship_user_code
    image: twinship_user_code:latest
    restart: always
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
      DAGSTER_HOME: /app
      <<: *graphdb-env
    volumes:
      - ./data:/app/data
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      postgresql:
        condition: service_healthy
      graphdb:
        condition: service_healthy

  # Dagster webserver
  webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: twinship_webserver
    entrypoint:
      - uv
      - run
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    ports:
      - "${DAGSTER_WEBSERVER_PORT:-3000}:3000"
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      - postgresql
      - user_code

  # Dagster daemon (schedules, sensors, run queue)
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: twinship_daemon
    entrypoint:
      - uv
      - run
      - dagster-daemon
      - run
    restart: on-failure
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
      <<: *graphdb-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      - postgresql
      - user_code

volumes:
  postgresql_data:
  graphdb_home:
  dagster_storage:
  pipeline_output:

networks:
  twinship_network:
    driver: bridge
