services:
  # PostgreSQL for Dagster storage
  postgresql:
    image: postgres:15
    container_name: twinship_postgresql
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - twinship_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GraphDB triplestore
  graphdb:
    image: ontotext/graphdb:10.8.12
    container_name: twinship_graphdb
    ports:
      - "7200:7200"
    volumes:
      - graphdb_home:/opt/graphdb/home
    networks:
      - twinship_network

  # User code container (gRPC server)
  user_code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twinship_user_code
    image: twinship_user_code:latest
    restart: always
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
      DAGSTER_HOME: /app
      GRAPHDB_BASE_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY_ID: twinship
      GRAPHDB_REPOSITORY_TITLE: TwinShip Data Repository
      GRAPHDB_CLEAR_BEFORE_UPLOAD: "true"
      GRAPHDB_TIMEOUT_SECONDS: "30"
      GRAPHDB_MAX_READINESS_CHECKS: "20"
      GRAPHDB_READINESS_CHECK_INTERVAL_SECONDS: "3"
      GRAPHDB_USERNAME: ""
      GRAPHDB_PASSWORD: ""
    volumes:
      - ./data:/app/data
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      postgresql:
        condition: service_healthy
      graphdb:
        condition: service_started

  # Dagster webserver
  webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: twinship_webserver
    entrypoint:
      - uv
      - run
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - workspace.yaml
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
      GRAPHDB_BASE_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY_ID: twinship
      GRAPHDB_REPOSITORY_TITLE: TwinShip Data Repository
      GRAPHDB_CLEAR_BEFORE_UPLOAD: "true"
      GRAPHDB_TIMEOUT_SECONDS: "30"
      GRAPHDB_MAX_READINESS_CHECKS: "20"
      GRAPHDB_READINESS_CHECK_INTERVAL_SECONDS: "3"
      GRAPHDB_USERNAME: ""
      GRAPHDB_PASSWORD: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      - postgresql
      - user_code
      - graphdb

  # Dagster daemon (schedules, sensors, run queue)
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: twinship_daemon
    entrypoint:
      - uv
      - run
      - dagster-daemon
      - run
    restart: on-failure
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgresql
      DAGSTER_CURRENT_IMAGE: twinship_user_code:latest
      GRAPHDB_BASE_URL: http://graphdb:7200
      GRAPHDB_REPOSITORY_ID: twinship
      GRAPHDB_REPOSITORY_TITLE: TwinShip Data Repository
      GRAPHDB_CLEAR_BEFORE_UPLOAD: "true"
      GRAPHDB_TIMEOUT_SECONDS: "30"
      GRAPHDB_MAX_READINESS_CHECKS: "20"
      GRAPHDB_READINESS_CHECK_INTERVAL_SECONDS: "3"
      GRAPHDB_USERNAME: ""
      GRAPHDB_PASSWORD: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pipeline_output:/app/output
      - dagster_storage:/app/storage
    networks:
      - twinship_network
    depends_on:
      - postgresql
      - user_code
      - graphdb

volumes:
  postgresql_data:
  graphdb_home:
  dagster_storage:
  pipeline_output:

networks:
  twinship_network:
    driver: bridge
