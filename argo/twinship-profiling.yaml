apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: twinship-profiling-
  labels:
    simpipe.sct.sintef.no/project: twinship
spec:
  entrypoint: twinship-pipeline
  # Override SIM-PIPE's default parallelism=1 so per-vessel steps run in parallel
  parallelism: 4
  templates:
    # =========================================================================
    # DAG: pipeline structure
    # =========================================================================
    - name: twinship-pipeline
      dag:
        tasks:
          # Step 1: Load spreadsheet and discover vessels
          - name: extract-spreadsheet
            template: extract-spreadsheet-step

          # Step 2: Extract vessel JSON (parallel per vessel)
          - name: extract-grimaldi-roro
            template: extract-vessel-step
            dependencies: [extract-spreadsheet]
            arguments:
              parameters:
                - name: vessel
                  value: grimaldi-roro
              artifacts:
                - name: spreadsheet-data
                  from: "{{tasks.extract-spreadsheet.outputs.artifacts.spreadsheet-data}}"
          - name: extract-stena-ropax
            template: extract-vessel-step
            dependencies: [extract-spreadsheet]
            arguments:
              parameters:
                - name: vessel
                  value: stena-ropax
              artifacts:
                - name: spreadsheet-data
                  from: "{{tasks.extract-spreadsheet.outputs.artifacts.spreadsheet-data}}"
          - name: extract-stena-tanker
            template: extract-vessel-step
            dependencies: [extract-spreadsheet]
            arguments:
              parameters:
                - name: vessel
                  value: stena-tanker
              artifacts:
                - name: spreadsheet-data
                  from: "{{tasks.extract-spreadsheet.outputs.artifacts.spreadsheet-data}}"
          - name: extract-futuristic-vessel
            template: extract-vessel-step
            dependencies: [extract-spreadsheet]
            arguments:
              parameters:
                - name: vessel
                  value: futuristic-vessel
              artifacts:
                - name: spreadsheet-data
                  from: "{{tasks.extract-spreadsheet.outputs.artifacts.spreadsheet-data}}"

          # Step 3: Harmonise to RDF (parallel per vessel)
          - name: harmonise-grimaldi-roro
            template: harmonise-vessel-step
            dependencies: [extract-grimaldi-roro]
            arguments:
              parameters:
                - name: vessel
                  value: grimaldi-roro
              artifacts:
                - name: vessel-json
                  from: "{{tasks.extract-grimaldi-roro.outputs.artifacts.vessel-json}}"
                - name: validated-json
                  from: "{{tasks.extract-grimaldi-roro.outputs.artifacts.validated-json}}"
          - name: harmonise-stena-ropax
            template: harmonise-vessel-step
            dependencies: [extract-stena-ropax]
            arguments:
              parameters:
                - name: vessel
                  value: stena-ropax
              artifacts:
                - name: vessel-json
                  from: "{{tasks.extract-stena-ropax.outputs.artifacts.vessel-json}}"
                - name: validated-json
                  from: "{{tasks.extract-stena-ropax.outputs.artifacts.validated-json}}"
          - name: harmonise-stena-tanker
            template: harmonise-vessel-step
            dependencies: [extract-stena-tanker]
            arguments:
              parameters:
                - name: vessel
                  value: stena-tanker
              artifacts:
                - name: vessel-json
                  from: "{{tasks.extract-stena-tanker.outputs.artifacts.vessel-json}}"
                - name: validated-json
                  from: "{{tasks.extract-stena-tanker.outputs.artifacts.validated-json}}"
          - name: harmonise-futuristic-vessel
            template: harmonise-vessel-step
            dependencies: [extract-futuristic-vessel]
            arguments:
              parameters:
                - name: vessel
                  value: futuristic-vessel
              artifacts:
                - name: vessel-json
                  from: "{{tasks.extract-futuristic-vessel.outputs.artifacts.vessel-json}}"
                - name: validated-json
                  from: "{{tasks.extract-futuristic-vessel.outputs.artifacts.validated-json}}"

          # Step 4: SHACL validate + write TTL (parallel per vessel)
          - name: validate-grimaldi-roro
            template: validate-vessel-step
            dependencies: [harmonise-grimaldi-roro]
            arguments:
              parameters:
                - name: vessel
                  value: grimaldi-roro
              artifacts:
                - name: vessel-rdf
                  from: "{{tasks.harmonise-grimaldi-roro.outputs.artifacts.vessel-rdf}}"
          - name: validate-stena-ropax
            template: validate-vessel-step
            dependencies: [harmonise-stena-ropax]
            arguments:
              parameters:
                - name: vessel
                  value: stena-ropax
              artifacts:
                - name: vessel-rdf
                  from: "{{tasks.harmonise-stena-ropax.outputs.artifacts.vessel-rdf}}"
          - name: validate-stena-tanker
            template: validate-vessel-step
            dependencies: [harmonise-stena-tanker]
            arguments:
              parameters:
                - name: vessel
                  value: stena-tanker
              artifacts:
                - name: vessel-rdf
                  from: "{{tasks.harmonise-stena-tanker.outputs.artifacts.vessel-rdf}}"
          - name: validate-futuristic-vessel
            template: validate-vessel-step
            dependencies: [harmonise-futuristic-vessel]
            arguments:
              parameters:
                - name: vessel
                  value: futuristic-vessel
              artifacts:
                - name: vessel-rdf
                  from: "{{tasks.harmonise-futuristic-vessel.outputs.artifacts.vessel-rdf}}"


    # =========================================================================
    # Step templates
    # =========================================================================

    # Step 1: Extract spreadsheet data
    - name: extract-spreadsheet-step
      outputs:
        artifacts:
          - name: spreadsheet-data
            path: /tmp/pipeline/spreadsheet_data.pkl
            archive:
              none: {}
      container:
        image: twinship_user_code:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/.venv/bin/python", "/app/argo/runner.py"]
        args: ["extract-spreadsheet"]
        workingDir: /app
        env:
          - name: PYTHONPATH
            value: /app/.venv/lib/python3.11/site-packages:/app

    # Step 2: Extract and validate vessel JSON from spreadsheet
    - name: extract-vessel-step
      inputs:
        parameters:
          - name: vessel
        artifacts:
          - name: spreadsheet-data
            path: /tmp/pipeline/spreadsheet_data.pkl
      outputs:
        artifacts:
          - name: vessel-json
            path: "/tmp/pipeline/extracted_vessel_json__{{inputs.parameters.vessel}}.pkl"
            archive:
              none: {}
          - name: validated-json
            path: "/tmp/pipeline/validated_vessel_json__{{inputs.parameters.vessel}}.pkl"
            archive:
              none: {}
      container:
        image: twinship_user_code:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/.venv/bin/python", "/app/argo/runner.py"]
        args: ["extract-vessel", "{{inputs.parameters.vessel}}"]
        workingDir: /app
        env:
          - name: PYTHONPATH
            value: /app/.venv/lib/python3.11/site-packages:/app

    # Step 3: Harmonise vessel JSON to RDF graph
    - name: harmonise-vessel-step
      inputs:
        parameters:
          - name: vessel
        artifacts:
          - name: vessel-json
            path: "/tmp/pipeline/extracted_vessel_json__{{inputs.parameters.vessel}}.pkl"
          - name: validated-json
            path: "/tmp/pipeline/validated_vessel_json__{{inputs.parameters.vessel}}.pkl"
      outputs:
        artifacts:
          - name: vessel-rdf
            path: "/tmp/pipeline/vessel_rdf_graph__{{inputs.parameters.vessel}}.pkl"
            archive:
              none: {}
      container:
        image: twinship_user_code:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/.venv/bin/python", "/app/argo/runner.py"]
        args: ["harmonise-vessel", "{{inputs.parameters.vessel}}"]
        workingDir: /app
        env:
          - name: PYTHONPATH
            value: /app/.venv/lib/python3.11/site-packages:/app

    # Step 4: SHACL validate RDF graph and write TTL file
    - name: validate-vessel-step
      inputs:
        parameters:
          - name: vessel
        artifacts:
          - name: vessel-rdf
            path: "/tmp/pipeline/vessel_rdf_graph__{{inputs.parameters.vessel}}.pkl"
      outputs:
        artifacts:
          - name: vessel-ttl
            path: "/tmp/pipeline/output/{{inputs.parameters.vessel}}.ttl"
            archive:
              none: {}
      container:
        image: twinship_user_code:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/.venv/bin/python", "/app/argo/runner.py"]
        args: ["validate-vessel", "{{inputs.parameters.vessel}}"]
        workingDir: /app
        env:
          - name: PYTHONPATH
            value: /app/.venv/lib/python3.11/site-packages:/app

